<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExactDomain</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="Find and manage one result per domain for an exact search phrase.">

<style>
:root{--bg:#0b0f14;--panel:#111922;--panel2:#18232f;--line:#243445;--text:#e8eff6;--muted:#8b9db2;--mint:#3ee6b4;--cyan:#4cc9f0;--green:#34d27b;--red:#ff6472;--amber:#f2b94b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
a{color:var(--cyan)}
[hidden]{display:none!important}
small,.muted{color:var(--muted)}
b{font-weight:650}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));background:#0b0f14f2;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex:1;max-width:220px;gap:3px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tabs button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel2);color:var(--mint);box-shadow:inset 0 0 0 1px var(--line)}
.chip{margin-left:auto;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--cyan);font-size:12.5px;white-space:nowrap}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.pri{background:linear-gradient(135deg,var(--mint),var(--cyan));border-color:transparent;color:#05221a}
.btn.danger{background:#3a1d24;border-color:#6a2a35;color:#ffb3bb}
.btn.big{flex:1;min-height:50px;font-size:16px}
.btn.ico{width:40px;min-height:40px;padding:0;font-size:17px}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;padding:8px 0;color:var(--cyan);text-align:left;font-size:13.5px}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.brand{margin:2px 0 10px;font-size:20px;font-weight:750;letter-spacing:-.01em}
.brand span{color:var(--mint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:13px}
label small{font-size:12px}
input[type=text],input:not([type]),input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:16px}
select{font-size:14.5px;min-height:42px;padding:6px 8px}
textarea{min-height:56px;resize:vertical;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--mint);outline-offset:-1px}
.or{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.or span{color:var(--muted);font-size:12px;font-weight:700}
.check{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--text);font-size:14.5px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--mint);flex:none}
.line{display:flex;gap:8px;align-items:stretch}
#info{margin:10px 2px;font-size:13px}
#run .rl{margin-bottom:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.grid4 span{display:block;font-size:17px;font-weight:700;color:var(--text)}
.lane{margin-top:8px;font-size:12.5px;word-break:break-word}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.menu .note{grid-column:1/-1;margin:2px 0 0;font-size:12px;color:var(--muted)}
.warn{padding:8px 12px;background:#3a2a10;color:#ffd58a;font-size:13px}
.topic{display:flex;align-items:center;gap:10px}
.tmain{flex:1;min-width:0}
.tq{font-weight:700;overflow-wrap:anywhere}
.tor{font-size:13px;color:var(--mint)}
.tor i{font-style:normal;color:var(--muted);font-size:11px}
.tmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tt{min-width:0;overflow-wrap:anywhere}
.tools{display:flex;gap:8px;margin:8px 0}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fbar .check{margin:6px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;padding:0 0 8px}
.filters label{margin:6px 0 2px;font-size:12px}
.filters .wide{grid-column:1/-1}
#count{margin:4px 2px 6px;font-size:13px;color:var(--muted)}
details.add{margin:0 0 8px}
details.add summary{padding:8px 2px;color:var(--cyan);font-size:13.5px;cursor:pointer}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 6px;padding:5px 6px 5px 8px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.open{background:#14202c}
.row.fade{opacity:.45}
.main-r{display:flex;gap:8px;min-width:0;padding:4px 0;cursor:pointer}
.num{flex:none;width:26px;text-align:right;color:var(--muted);font-size:11px;padding-top:3px}
.mid{min-width:0;flex:1}
.dom{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:10.5px;line-height:1.5;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--green);border-color:#1e5b3b}
.tag.no{color:var(--red);border-color:#6a2b34}
.tag.st{color:var(--amber);border-color:#5e4a1e}.tag.qual{color:var(--green);border-color:#1e5b3b}.tag.qrisk{color:var(--red);border-color:#6a2b34}.tag.qunclear{color:var(--amber);border-color:#5e4a1e}
.qscan{margin:7px 0 9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.5px;color:var(--muted)}.qscan b{color:var(--text)}.qnote{font-size:11.5px;color:var(--muted);margin:3px 0 8px}
.bdg{font-size:9.5px;line-height:1.6;font-weight:700;letter-spacing:.04em;padding:0 6px;border-radius:5px;background:#1b2a38;color:var(--cyan)}
.bdg.art{color:var(--amber);background:#2e2512}
.acts{display:flex;gap:4px}
.gr,.rd{opacity:.5;filter:grayscale(1)}
.gr.on{opacity:1;filter:none;background:#143826;border-color:var(--green)}
.rd.on{opacity:1;filter:none;background:#3a1a20;border-color:var(--red)}
.more{grid-column:1/-1;display:grid;gap:6px;padding:4px 2px 8px 0}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-height:40px;padding:0 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);font-size:13px;font-weight:600}
.seg button.on{color:var(--text);background:var(--panel2);border-color:var(--mint)}
.seg button.on.approved{color:var(--green);border-color:var(--green)}
.seg button.on.rejected{color:var(--red);border-color:var(--red)}
.two,.det{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.two label,.det label{margin:2px 0;font-size:12px}
.det .wide{grid-column:1/-1}
.snip{margin:2px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.pad{padding:14px}
#more-wrap{margin:10px 0}
#more-wrap .btn{width:100%}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;padding:10px 14px;border-radius:10px;background:#223344;border:1px solid var(--line);color:var(--text);font-size:14px;z-index:50;text-align:center}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}.seg button{font-size:12px;padding:0 3px}}
@media (max-width:320px){.menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="bar">
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-act="tab" data-tab="search" class="on">Search</button>
    <button role="tab" data-act="tab" data-tab="found">Found</button>
  </nav>
  <button id="credits" class="chip" data-act="credits" aria-label="Estimated Serper credits. Tap to correct.">≈ 0 credits</button>
  <button id="menuBtn" class="btn ico" data-act="menu" aria-label="Backup and key menu" aria-expanded="false">⋯</button>
</header>
<div id="warn" class="warn" role="alert" hidden></div>
<section id="menu" class="menu" hidden>
  <button class="btn sm" data-act="exportJson">Export backup (JSON)</button>
  <button class="btn sm" data-act="importJson">Import backup</button>
  <button class="btn sm" data-act="exportAllCsv">All topics CSV</button>
  <button class="btn sm" data-act="apiKey">Serper API key…</button>
  <button class="btn sm" id="snapBtn" data-act="restoreSnap" hidden>Restore snapshot</button>
  <button class="btn sm" id="preBtn" data-act="exportPre" hidden>Pre-migration copy</button>
  <p class="note" id="storageNote"></p>
</section>
<main>
  <section id="tab-search">
    <h1 class="brand"><span>Exact</span>Domain</h1>
    <div id="keyBox" class="card" hidden>
      <label for="keyInput" style="margin-top:0">Serper API key <small>(kept only in this browser)</small></label>
      <div class="line">
        <input id="keyInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste key">
        <button class="btn pri" data-act="saveKey">Save</button>
        <button class="btn" id="keyClear" data-act="clearKey" hidden>Clear</button>
      </div>
    </div>
    <form id="form" autocomplete="off">
      <label for="q" style="margin-top:0">Main exact text</label>
      <input id="q" type="text" placeholder="On Cloud 6" enterkeyhint="search" autocapitalize="off" spellcheck="false">
      <label>Must also contain <small>(optional, exact)</small></label>
      <div class="or"><input id="e1" type="text" placeholder="Woman" aria-label="Optional exact text 1" autocapitalize="off" spellcheck="false"><span>OR</span><input id="e2" type="text" placeholder="Women" aria-label="Optional exact text 2" autocapitalize="off" spellcheck="false"></div>
      <label class="check"><input type="checkbox" id="usOnly"> 🇺🇸 Search US-focused sites only</label>
      <div class="line">
        <button type="submit" id="go" class="btn pri big">Search deep</button>
        <button type="button" id="stop" class="btn danger big" data-act="stop" hidden>Stop</button>
      </div>
    </form>
    <div id="info"></div>
    <div id="run" class="card" hidden></div>
  </section>
  <section id="tab-found" hidden>
    <div id="topics"></div>
    <div id="topicView" hidden></div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

const $ = (s, r = document) => r.querySelector(s);
const now = () => Date.now();
const str = v => Array.isArray(v) ? v.join('; ') : String(v ?? '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cleanTerm = s => String(s ?? '').replace(/["“”„‟]/g, ' ').replace(/\s+/g, ' ').trim();
const norm = s => cleanTerm(s).toLowerCase();
const num = (v, d = 0) => (v !== '' && v !== null && v !== undefined && Number.isFinite(+v)) ? +v : d;
const fmt = n => Number(n || 0).toLocaleString('en-US');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uniq = list => { const seen = new Set(); return list.map(cleanTerm).filter(x => { const k = x.toLowerCase(); if (!x || seen.has(k)) return false; seen.add(k); return true; }); };
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function topicKey(q, terms) { return norm(q) + '|' + [...new Set((terms || []).map(norm).filter(Boolean))].sort().join('|'); }
function domainOf(u) {
  try {
    const s = String(u || '').trim();
    return new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(s) ? s : 'https://' + s).hostname.toLowerCase().replace(/^www\./, '').replace(/\.$/, '');
  } catch (e) { return ''; }
}
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
const GENERIC_CC = new Set(['us', 'co', 'io', 'me', 'tv', 'ai', 'fm', 'cc', 'ly', 'sh', 'to', 'ws']);
function isForeign(d) { const t = d.slice(d.lastIndexOf('.') + 1); return t.length === 2 && !GENERIC_CC.has(t); }
function ago(t) {
  if (!t) return 'never';
  const s = (now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 30) return Math.floor(s / 86400) + 'd ago';

function applySeed(db) {

  const det = d => s.domainDetails[d] ?? (s.domainDetails[d] = { orderNumber: '', price: '', notes: '' });
  SEED.forEach(([d, , order, price, outcome, diff, note]) => {
    if (outcome && !s.domainOutcomes[d]) s.domainOutcomes[d] = outcome;
    if (diff && !s.domainRatings[d] && s.domainOutcomes[d] === 'approved') s.domainRatings[d] = diff;
    const x = det(d);
    if (!x.orderNumber && order) x.orderNumber = order;
    if (!x.price && price) x.price = price;
    if (!x.notes && note) x.notes = note;
  });

  // Recovery/history belongs to On Cloud 5, not On Cloud 6.
  let t = findTopicByKey(db, topicKey(SEED_TOPIC.query, SEED_TOPIC.anyTerms));
  if (!t) { t = newTopic(SEED_TOPIC.query, SEED_TOPIC.anyTerms); db.topics[t.id] = t; }

  const holder = (d, title) => ({ domain: d, url: 'https://' + d + '/', title, snippet: '', foundAt: now(), sourceGl: '', usFocused: false, manualKnown: true, manualSource: 'notes' });
  SEED.forEach(r => addResult(t, holder(r[0], r[1])));

    if (note) { const x = det(d); if (!x.notes) x.notes = note; }

  // Remove only untouched FROM NOTES placeholders there. Real Serper hits stay in On Cloud 6.
  let moved = 0;
  const old = findTopicByKey(db, topicKey(OLD_SEED_TOPIC.query, OLD_SEED_TOPIC.anyTerms));
  if (old && old.id !== t.id) {
    const before = old.results.length;

    moved = before - old.results.length;

    if (!old.results.length && !(old.state && old.state.totalCalls)) delete db.topics[old.id];

function qualityText(items) {

  const years = [], re = /\b(?:founded|established|started|formed|incorporated|since)\b[^.\n]{0,55}?\b((?:18|19|20)\d{2})\b/ig;

  const year = qualityFoundedYear(all), age = year ? new Date().getFullYear() - year : 0;
  const f = { age:'unknown', financial:'unknown', reputation:'unknown', employee:'unknown', longevity:'unknown', legal:'unknown', market:'unknown', transparency:'unknown' };

  if (year) f.age = age >= 10 ? 'good' : age < 5 ? 'bad' : 'unknown';
  if (year) f.longevity = age >= 20 ? 'good' : age < 5 ? 'bad' : 'unknown';

  const finBad = /bankrupt|chapter\s+(?:7|11)|insolvenc|liquidat|going concern|default(?:ed)? on (?:its )?debt|ceased operations|closing all stores|shut down/i.test(all);
  const finGood = /profitable|profitability|record (?:revenue|sales|profit)|revenue (?:grew|growth|increased)|positive cash flow|operating profit|net income|ebitda/i.test(a);
  f.financial = finBad ? 'bad' : finGood ? 'good' : 'unknown';

  const ratings = qualityRatings(b);
  const repBad = /\bscam\b|\bfraud\b|poor customer service|poor reviews|many complaints|numerous complaints|hundreds of complaints/i.test(b) || ratings.some(x => x <= 2.5);
  const repGood = /bbb[^.\n]{0,30}\bA\+?\b|highly rated|excellent reviews/i.test(b) || ratings.some(x => x >= 4);
  f.reputation = repBad ? 'bad' : repGood ? 'good' : 'unknown';

  const empBad = /layoffs?|laid off|job cuts|workforce reduction|mass layoff|cut(?:ting)? (?:its )?workforce/i.test(b);
  const empGood = /great place to work|top workplace|best places? to work|employee(?:s)? rate[^.\n]{0,25}[4-5](?:\.\d)?/i.test(b);
  f.employee = empBad ? 'bad' : empGood ? 'good' : 'unknown';

  const legalBad = /class action|attorney general|federal trade commission|\bftc\b|regulatory action|consent decree|civil penalty|chapter\s+(?:7|11)|bankrupt|fraud lawsuit|settlement[^.\n]{0,30}\$\d/i.test(b);
  f.legal = legalBad ? 'bad' : ((second || []).length >= 5 ? 'good' : 'unknown');

  f.market = /market leader|leading (?:retailer|brand|company|provider)|one of the largest|largest [^.\n]{0,35}(?:retailer|company|brand)|nationwide|fortune\s*500|millions of customers|over \d+[,.]?\d* stores|more than \d+[,.]?\d* stores/i.test(all) ? 'good' : 'unknown';

  Object.entries(QUALITY_WEIGHTS).forEach(([k,w]) => {

async function qualityCall(key, query, run, fallbackQuery) {
  let currentQuery = query;
  let usedFallback = false;
  for (let attempt = 0; attempt < 3; attempt++) {
    const ctl = new AbortController(); run.ctl = ctl;
    const timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const resp = await fetch(ENDPOINT, { method:'POST', headers:{'X-API-KEY':key,'Content-Type':'application/json'}, body:JSON.stringify({q:currentQuery,hl:'en',gl:'us',num:10,autocorrect:false}), signal:ctl.signal });
      let data = null; try { data = await resp.json(); } catch(e) {}
      if (resp.ok) {
        S().estimatedCredits = Math.max(0, S().estimatedCredits - 1);
        return { ok:true, organic:Array.isArray(data && data.organic) ? data.organic : [], usedFallback };
      }
      const msg = String((data && (data.message || data.error)) || resp.statusText || 'HTTP ' + resp.status);

      // Serper free accounts can reject certain search patterns. Fall back to a simpler query instead of stopping the scan.
      if (/pattern not allowed/i.test(msg)) {
        if (fallbackQuery && currentQuery !== fallbackQuery) {
          currentQuery = fallbackQuery;
          usedFallback = true;
          continue;
        }
        const plain = currentQuery.replace(/["']/g,'').split(/\s+/).slice(0,2).join(' ');
        if (plain && plain !== currentQuery) {
          currentQuery = plain;
          usedFallback = true;
          continue;
        }
        return {ok:false,kind:'restricted',msg};
      }

      if (resp.status === 401 || resp.status === 403) return {ok:false,kind:'auth',msg};
      if (resp.status === 402 || /credit/i.test(msg)) return {ok:false,kind:'credits',msg};
      if ((resp.status === 429 || resp.status >= 500) && attempt < 2) { await sleep(1200); continue; }
      return {ok:false,kind:resp.status === 429 || resp.status >= 500 ? 'rate' : 'http',msg};
    } catch(e) {
      if (run.stop) return {ok:false,kind:'abort',msg:'Stopped'};
      if (attempt < 2) { await sleep(900); continue; }
      return {ok:false,kind:'net',msg:e && e.name === 'AbortError' ? 'Timed out' : 'Network error'};
    } finally { clearTimeout(timer); }
  }
  return {ok:false,kind:'net',msg:'Network error'};
}

const COUNTRIES = [['ca', 'Canada'], ['gb', 'UK'], ['au', 'Australia'], ['ie', 'Ireland'], ['nz', 'New Zealand'], ['de', 'Germany'], ['fr', 'France'], ['nl', 'Netherlands'], ['se', 'Sweden'], ['no', 'Norway'], ['dk', 'Denmark'], ['fi', 'Finland'], ['es', 'Spain'], ['it', 'Italy'], ['ch', 'Switzerland'], ['at', 'Austria'], ['be', 'Belgium'], ['jp', 'Japan'], ['kr', 'South Korea'], ['hk', 'Hong Kong'], ['sg', 'Singapore'], ['in', 'India'], ['za', 'South Africa'], ['mx', 'Mexico'], ['br', 'Brazil'], ['ae', 'UAE'], ['pl', 'Poland']];

    TLDS.forEach(t => L.push({ k: 'site:.' + t, gl: 'us', hl: 'en', tld: t, pages: 2, op: true }));

// Rotating window of already-found domains to exclude, so deeper results surface.

async function callSerper(key, plan, run) {

    const ctl = new AbortController(); run.ctl = ctl;
    const timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const resp = await fetch(ENDPOINT, { method: 'POST', headers: { 'X-API-KEY': key, 'Content-Type': 'application/json' }, body: JSON.stringify(plan.body), signal: ctl.signal });

      if (resp.status === 401 || resp.status === 403) return { error: true, kind: 'auth', msg };
      if (resp.status === 402 || /credit/i.test(msg)) return { error: true, kind: 'credits', msg };

async function runSearch(f, key) {
  let topic = findTopicByKey(DB, topicKey(f.q, f.terms));
  if (!topic) topic = newTopic(f.q, f.terms); // only stored once the first request succeeds
  const st = topic.state, us = f.us;
  const variants = (topic.anyTerms.length ? topic.anyTerms : ['']).map(t => ({ label: t, q: '"' + topic.query + '"' + (t ? ' "' + t + '"' : '') }));
  const run = { topic, active: true, stop: false, calls: 0, empty: 0, added: 0, upgraded: 0, lane: '', msg: '', restricted: false, ctl: null, counted: false };
  UI.run = run; UI.last = null; setRunning(true); renderRun(); lockScreen();
  let hard = 0;
  const persist = () => { if (DB.topics[topic.id]) saveNow(); };
  try {
    while (!run.stop && run.calls < MAX_CALLS) {
      const plan = nextPlan(topic, us, variants);
      if (!plan) { run.msg = 'Every available lane has been searched for this topic' + (st.operatorRestricted ? ' (operator lanes are restricted on this account)' : '') + '. The next run starts over from the first lane and will mostly repeat.'; persist(); break; }
      run.lane = plan.label; renderRun();
      const res = await callSerper(key, plan, run);
      if (run.stop) break;
      if (res.error) {
        if (res.kind === 'restricted') { st.operatorRestricted = true; run.restricted = true; setCur(topic, us, plan.laneEnd); persist(); continue; }
        if (RUN_MSG[res.kind]) { run.msg = RUN_MSG[res.kind]; break; }
        if (++hard >= 3) { run.msg = 'Serper returned errors: ' + res.msg; break; }
        setCur(topic, us, plan.blockEnd); persist(); continue;
      }
      hard = 0; run.calls++;
      const m = mergeOrganic(topic, res.organic, plan, us);
      run.added += m.added; run.upgraded += m.upgraded;
      if (!DB.topics[topic.id]) DB.topics[topic.id] = topic;
      if (!run.counted) { st.totalRuns++; run.counted = true; }
      st.totalCalls++; st.lastStrategy = plan.label; st.lastPage = plan.page;
      if (res.organic.length === 0) { run.empty++; setCur(topic, us, plan.blockEnd); } else { run.empty = 0; setCur(topic, us, plan.next); }
      topic.updatedAt = now();
      S().estimatedCredits = Math.max(0, S().estimatedCredits - 1);
      saveNow(); renderCredits(); renderRun();
      if (run.empty >= MAX_EMPTY) { run.msg = 'Stopped after ' + MAX_EMPTY + ' empty pages in a row.'; break; }
    }
  } finally {
    run.active = false; UI.run = null; UI.last = run; unlockScreen(); setRunning(false);
    if (run.stop) run.msg = 'Stopped.';
    else if (!run.msg) run.msg = run.calls >= MAX_CALLS ? 'Pass complete — ' + run.calls + ' requests.' : 'Done.';
    renderRun(); updateSearchInfo(); renderCredits(); refreshFound();
  }
}

function showKeyBox(show) {
  if (show) setTab('search');
  $('#keyBox').hidden = !show; $('#keyClear').hidden = !store.get(KEY_API);
  if (show) { $('#keyInput').value = ''; $('#keyInput').focus(); }
}

/* ================= tabs / Found ================= */
function setTab(tab) {
  UI.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#tab-search').hidden = tab !== 'search'; $('#tab-found').hidden = tab !== 'found';
  if (tab === 'found') renderFound(); else updateSearchInfo();
  window.scrollTo(0, 0);
}
function renderFound() {
  const inTopic = !!(UI.topicId && DB.topics[UI.topicId]);
  $('#topics').hidden = inTopic; $('#topicView').hidden = !inTopic;
  if (inTopic) renderTopicView(); else { UI.topicId = null; renderTopics(); }
}
function refreshFound() { if (UI.tab === 'found') renderFound(); }
function renderTopics() {
  const list = Object.values(DB.topics).sort((a, b) => b.updatedAt - a.updatedAt);
  $('#topics').innerHTML = list.length ? list.map(t => `<article class="card topic">
    <div class="tmain"><div class="tq">${esc(t.query)}</div>${t.anyTerms.length ? `<div class="tor"><i>must also contain</i> ${t.anyTerms.map(esc).join(' <i>OR</i> ')}</div>` : ''}
    <div class="tmeta">${fmt(t.results.length)} domains · ${fmt(t.state.totalCalls)} requests · ${ago(t.updatedAt)}</div></div>
    <button class="btn" data-act="open" data-id="${esc(t.id)}">Open</button></article>`).join('')
    : '<p class="muted pad">No topics yet. Run a search and it will be saved here.</p>';
}

/* ================= topic view ================= */
const optHtml = (list, cur) => list.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`).join('');
const DIFF_OPTS = [['', 'Not set'], ...Object.entries(DIFF_LABEL)];
const STATUS_OPTS = [['', 'No status'], ...Object.entries(STATUS_LABEL)];
const filtersHtml = () => Object.entries(F_OPTS).map(([k, [label, opts]]) => `<label>${label}<select data-chg="flt" data-k="${k}">${optHtml(opts, S()[k])}</select></label>`).join('')
  + `<label class="wide">Find<input type="search" id="find" value="${esc(UI.find)}" placeholder="Domain or title" autocomplete="off"></label>`;
function filterBtnLabel() { const n = activeFilters(); return 'Filters' + (n ? ' (' + n + ')' : '') + (UI.showFilters ? ' ▴' : ' ▾'); }

function renderTopicView() {
  const t = DB.topics[UI.topicId];
  $('#topicView').innerHTML = `<div class="thead"><button class="btn sm" data-act="back">← Topics</button>
    <div class="tt"><b>${esc(t.query)}</b>${t.anyTerms.length ? ' <span class="tor">+ ' + t.anyTerms.map(esc).join(' <i>OR</i> ') + '</span>' : ''}</div></div>
    <div class="tmeta">${fmt(t.results.length)} domains · ${fmt(t.state.totalCalls)} requests · updated ${ago(t.updatedAt)}</div>
    <div class="tools"><button class="btn sm pri" data-act="searchMore">Search more</button><button class="btn sm" data-act="qualityScan">${UI.qrun && UI.qrun.active ? 'Stop quality scan' : 'Assess quality'}</button><button class="btn sm" data-act="topicCsv">Export topic CSV</button></div>
    <div id="qscan" class="qscan" ${UI.qrun ? '' : 'hidden'}></div>
    <div class="fbar"><label class="check"><input type="checkbox" data-chg="hide" ${S().hideArticles ? 'checked' : ''}> Hide article/blog pages</label>
    <button class="btn sm" id="fbtn" data-act="filters">${filterBtnLabel()}</button></div>
    <div class="filters" id="filters"${UI.showFilters ? '' : ' hidden'}>${filtersHtml()}</div>
    <div id="count"></div>
    <details class="add"><summary>＋ Add known domain</summary><div class="line"><input id="addDom" type="text" placeholder="example.com" autocapitalize="off" spellcheck="false"><button class="btn" data-act="addDom">Add</button></div></details>
    <div class="qnote">Quality Companies uses your criteria as a conservative, best-effort web screen. Tap “Assess quality” to evaluate unassessed domains; results are cached.</div>
    <div class="rows" id="rows"></div><div id="more-wrap"></div>`;
  renderRows(); renderQualityRun();
}
function renderRows() {
  const t = DB.topics[UI.topicId];
  UI.idx = domainIndex(t); UI.nums = new Map(t.results.map((r, i) => [r.domain, i + 1]));
  const list = t.results.filter(passes), shown = list.slice(0, UI.limit);
  $('#rows').innerHTML = shown.map(r => rowHtml(r, UI.nums.get(r.domain), false)).join('') || '<p class="muted pad">No domains match these filters.</p>';
  $('#more-wrap').innerHTML = list.length > shown.length ? `<button class="btn" data-act="more">Show ${Math.min(CHUNK, list.length - shown.length)} more</button>` : '';
  $('#count').textContent = `${list.length} shown • ${t.results.length} total`;
  $('#fbtn').textContent = filterBtnLabel();
}
function updateCount() {
  const t = DB.topics[UI.topicId];
  if (t) $('#count').textContent = `${t.results.filter(passes).length} shown • ${t.results.length} total`;
}
function rowHtml(r, n, stale) {
  const d = r.domain, oc = ocOf(d), df = effDiff(d), st = stOf(d), rv = rvOf(d), open = UI.openRows.has(d), link = safeUrl(r.url);
  const tags = [];
  if (r.manualKnown) tags.push(`<span class="bdg">${r.manualSource === 'user' ? 'MANUAL' : 'FROM NOTES'}</span>`);
  if (isArticle(r)) tags.push('<span class="bdg art">ARTICLE?</span>');
  if (oc === 'approved') tags.push('<span class="tag ok">Approved</span>'); else if (oc === 'rejected') tags.push('<span class="tag no">Rejected</span>');
  if (df) tags.push(`<span class="tag">${DIFF_LABEL[df]}</span>`);
  if (st) tags.push(`<span class="tag st">${STATUS_SHORT[st]}</span>`);
  if (qaOf(d)) tags.push(qualityTag(qaOf(d)));
  return `<article class="row${open ? ' open' : ''}${stale ? ' fade' : ''}" data-d="${esc(d)}">
    <div class="main-r" data-act="toggle"><span class="num">${n}</span><div class="mid"><div class="dom">${esc(d)}</div>
    <div class="ttl">${esc(r.title)}</div>${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}</div></div>
    <div class="acts">${link ? `<a class="btn ico" href="${esc(link)}" target="_blank" rel="noopener noreferrer" aria-label="Open page" title="Open page">↗</a>` : ''}
    <button class="btn ico gr${rv === 'green' ? ' on' : ''}" data-act="rv" data-v="green" aria-label="Green" aria-pressed="${rv === 'green'}">✅</button>
    <button class="btn ico rd${rv === 'red' ? ' on' : ''}" data-act="rv" data-v="red" aria-label="Red" aria-pressed="${rv === 'red'}">❌</button></div>
    ${open ? moreHtml(r) : ''}</article>`;
}
function moreHtml(r) {
  const d = r.domain, oc = ocOf(d), x = dtOf(d) || {}, showDet = stOf(d) === 'delivery' || hasDetail(x) || UI.detOpen.has(d);
  const seg = [['approved', 'Approved / refunded'], ['rejected', 'Rejected'], ['', 'Unrated']].map(([k, l]) => `<button class="${oc === k ? 'on ' + k : ''}" data-act="oc" data-v="${k}">${l}</button>`).join('');
  return `<div class="more"><div class="seg" role="group" aria-label="Outcome">${seg}</div>
    <div class="two"><label>Difficulty<select data-chg="df">${optHtml(DIFF_OPTS, effDiff(d))}</select></label>
    <label>Status<select data-chg="st">${optHtml(STATUS_OPTS, stOf(d))}</select></label></div>
    ${showDet ? `<div class="det"><label>Order number<input type="text" data-inp="orderNumber" value="${esc(x.orderNumber || '')}"></label>
    <label>Price<input type="text" data-inp="price" value="${esc(x.price || '')}"></label>
    <label class="wide">Notes<textarea data-inp="notes" rows="2">${esc(x.notes || '')}</textarea></label></div>` : '<button class="lnk" data-act="det">＋ Order number / price / notes</button>'}
    ${r.snippet ? `<p class="snip">${esc(r.snippet)}</p>` : ''}</div>`;
}
function refreshRow(d) {
  const el = document.querySelector('.row[data-d="' + CSS.escape(d) + '"]'), r = UI.idx.get(d);
  if (!el || !r) return;
  el.outerHTML = rowHtml(r, UI.nums.get(d), !passes(r)); // edited rows stay put (dimmed if filtered out) until the next refresh
  updateCount(); $('#fbtn').textContent = filterBtnLabel();
}
function renderAll() {
  renderCredits();
  if (UI.tab === 'found') renderFound(); else updateSearchInfo();
  renderMenuInfo();
}

/* ================= navigation ================= */
function openTopic(id) {
  UI.topicId = id; UI.limit = CHUNK; UI.find = ''; UI.openRows.clear();
  history.pushState({ t: id }, '');
  renderFound(); window.scrollTo(0, 0);
}
function closeTopic() {
  if (history.state && history.state.t) { history.back(); return; } // Android back button does the same
  UI.topicId = null; renderFound();
}
window.addEventListener('popstate', e => {
  const id = e.state && e.state.t;
  UI.topicId = id && DB.topics[id] ? id : null;
  if (UI.topicId) UI.tab = 'found';
  setTab(UI.tab);
});

/* ================= actions ================= */
const rowDomain = el => el.closest('.row').dataset.d;
function toggleMenu(force) {
  const m = $('#menu'), show = typeof force === 'boolean' ? force : m.hidden;
  m.hidden = !show; $('#menuBtn').setAttribute('aria-expanded', String(show));
  if (show) renderMenuInfo();
}
function renderMenuInfo() {
  const snapAt = num(store.get(KEY_SNAP_AT)), hasSnap = !!store.get(KEY_SNAP);
  $('#snapBtn').hidden = !hasSnap; $('#snapBtn').textContent = 'Restore snapshot' + (snapAt ? ' (' + ago(snapAt) + ')' : '');
  $('#preBtn').hidden = !store.get(KEY_PRE);
  const mb = ((store.get(KEY_DB) || '').length / 1048576).toFixed(2);
  $('#storageNote').textContent = 'Saved only in this browser (' + mb + ' MB). Export a backup regularly.';
}
function saveKey() {
  const v = $('#keyInput').value.trim();
  if (!v) { toast('Paste your Serper API key first'); return; }
  try { store.set(KEY_API, v); } catch (e) { toast('Could not store the key in this browser'); return; }
  $('#keyBox').hidden = true; $('#keyInput').value = ''; toast('API key saved in this browser');
  if (UI.pending) startSearch();
}
function clearKey() { store.del(KEY_API); UI.pending = false; $('#keyBox').hidden = true; toast('API key removed from this browser'); }
function editCredits() {
  const v = prompt('Estimated Serper credits left (check your Serper dashboard):', String(S().estimatedCredits));
  if (v === null) return;
  const n = Math.round(num(String(v).replace(/[^\d.]/g, ''), NaN));
  if (!Number.isFinite(n) || n < 0) { toast('Enter a whole number'); return; }
  S().estimatedCredits = n; saveNow(); renderCredits();
}
function searchMore() {
  const t = DB.topics[UI.topicId];
  if (!t) return;
  $('#q').value = t.query; $('#e1').value = t.anyTerms[0] || ''; $('#e2').value = t.anyTerms[1] || '';
  persistForm(); setTab('search');
}
function topicCsv() {
  const t = DB.topics[UI.topicId];
  if (t) download(`exactdomain-${slug(t.query)}-${stamp()}.csv`, csvFor([t]), 'text/csv');
}
function addKnown() {
  const t = DB.topics[UI.topicId], inp = $('#addDom'), raw = inp.value.trim(), d = domainOf(raw);
  if (!d || !d.includes('.')) { toast('Enter a domain like example.com'); return; }
  if (findResult(t, d)) { toast(d + ' is already in this topic'); return; }
  pushResult(t, { domain: d, url: safeUrl(raw) || 'https://' + d + '/', title: '', snippet: '', foundAt: now(), sourceGl: '', usFocused: false, manualKnown: true, manualSource: 'user' });
  t.updatedAt = now(); saveNow(); inp.value = '';
  UI.find = d; $('#find').value = d; renderRows();
  toast('Added ' + d + ' — showing it via Find; clear Find to see all');
}
function exportJson() {
  saveNow();
  download(`exactdomain-backup-${stamp()}.json`, JSON.stringify({ app: 'ExactDomain', format: 1, exportedAt: new Date().toISOString(), db: DB }), 'application/json');
  toast('Backup exported');
}
function exportPre() { const raw = store.get(KEY_PRE); if (raw) download(`exactdomain-premigration-${stamp()}.json`, raw, 'application/json'); }
async function importFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { toast('That file is not valid JSON'); return; }
  const raw = obj && obj.db && typeof obj.db === 'object' ? obj.db : obj;
  if (!raw || typeof raw !== 'object' || (!raw.topics && !raw.settings)) { toast('No ExactDomain data found in that file'); return; }
  saveNow(); snapshotNow(); // current data is kept as the snapshot, so an import can be undone
  const r = mergeDB(DB, normalizeDB(raw));
  saveNow(); renderAll();
  toast(`Imported ${r.topics} new topic${r.topics === 1 ? '' : 's'}, ${r.domains} domains merged. Previous data kept as snapshot.`, 6000);
}
function restoreSnapshot() {
  const snap = store.get(KEY_SNAP), cur = store.get(KEY_DB);
  let parsed;
  try { parsed = JSON.parse(snap); } catch (e) { toast('No readable snapshot'); return; }
  if (!confirm('Swap current data with the last snapshot (' + ago(num(store.get(KEY_SNAP_AT))) + ')? Current data becomes the snapshot, so you can swap back.')) return;
  if (cur) { try { store.set(KEY_SNAP, cur); store.set(KEY_SNAP_AT, String(now())); } catch (e) { /* ignore */ } }
  DB = normalizeDB(parsed); saveNow(); UI.topicId = null; toggleMenu(false); renderAll(); toast('Snapshot restored');
}

const ACT = {
  tab: el => { if (el.dataset.tab === 'found' && UI.tab === 'found' && UI.topicId) closeTopic(); else setTab(el.dataset.tab); },
  credits: editCredits, menu: toggleMenu, exportJson, saveKey, clearKey, searchMore, topicCsv, exportPre,
  exportAllCsv: () => download(`exactdomain-all-topics-${stamp()}.csv`, csvFor(Object.values(DB.topics)), 'text/csv'),
  importJson: () => $('#importFile').click(),
  apiKey: () => { toggleMenu(false); showKeyBox(true); },
  restoreSnap: restoreSnapshot, stop: stopRun, addDom: addKnown, qualityScan: startQualityScan,
  open: el => openTopic(el.dataset.id), back: () => closeTopic(),
  filters: () => { UI.showFilters = !UI.showFilters; $('#filters').hidden = !UI.showFilters; $('#fbtn').textContent = filterBtnLabel(); },
  more: () => { UI.limit += CHUNK; renderRows(); },
  toggle: el => { const d = rowDomain(el); if (UI.openRows.has(d)) UI.openRows.delete(d); else UI.openRows.add(d); refreshRow(d); },
  rv: el => { const d = rowDomain(el); setReview(d, rvOf(d) === el.dataset.v ? '' : el.dataset.v); refreshRow(d); },
  oc: el => { const d = rowDomain(el); setOutcome(d, el.dataset.v); refreshRow(d); },
  det: el => { const d = rowDomain(el); UI.detOpen.add(d); refreshRow(d); }
};
let findTimer = 0;

/* ================= init ================= */
function init() {
  const L = loadDB();
  DB = L.db;
  let seedMoved = 0;
  if (DB.meta.seedVersion < SEED_VERSION) seedMoved = applySeed(DB); // fill-only plus one-time seed-topic correction
  saveNow();
  if (L.from === 'snapshot') toast('Main data was unreadable — restored from the last snapshot.', 7000);
  else if (L.legacy) toast('Existing data migrated. A pre-migration copy was kept.', 5000);
  else if (seedMoved) toast('Moved ' + seedMoved + ' restored note domains from On Cloud 6 to On Cloud 5.', 6000);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  if (history.state) history.replaceState(null, ''); // drop a stale topic entry left over from a reload
  const f = S().lastForm;
  $('#q').value = f.q; $('#e1').value = f.e1; $('#e2').value = f.e2; $('#usOnly').checked = S().usSearchOnly;
  renderCredits(); setTab('search'); renderRun(); renderMenuInfo();

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
  });
  document.addEventListener('change', e => {
    const el = e.target, k = el.dataset.chg;
    if (!k) { if (el.id === 'usOnly') persistForm(); return; }
    if (k === 'flt') { S()[el.dataset.k] = el.value; saveNow(); UI.limit = CHUNK; renderRows(); }
    else if (k === 'hide') { S().hideArticles = el.checked; saveNow(); UI.limit = CHUNK; renderRows(); }
    else { const d = rowDomain(el); (k === 'df' ? setDiff : setStatus)(d, el.value); refreshRow(d); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.inp) { setDetail(rowDomain(el), el.dataset.inp, el.value); return; }
    if (el.id === 'find') { clearTimeout(findTimer); findTimer = setTimeout(() => { UI.find = el.value.trim().toLowerCase(); UI.limit = CHUNK; renderRows(); }, 150); return; }
    if (el.closest('#form')) { persistForm(); updateSearchInfo(); }
  });
  $('#form').addEventListener('submit', e => { e.preventDefault(); startSearch(); });
  $('#keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveKey(); } });
  $('#importFile').addEventListener('change', e => { const file = e.target.files[0]; e.target.value = ''; if (file) importFile(file); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && dirty) saveNow();
    else if (document.visibilityState === 'visible' && UI.run) lockScreen();
  });
  window.addEventListener('pagehide', () => { if (dirty) saveNow(); });
  window.addEventListener('storage', e => { // another tab saved: reload instead of overwriting it later
    if (e.key !== KEY_DB || UI.run || !e.newValue) return;
    try { DB = normalizeDB(JSON.parse(e.newValue)); renderAll(); toast('Data refreshed from another tab'); } catch (err) { /* ignore */ }
  });
  window.addEventListener('error', e => setWarn('⚠ Script error: ' + (e.message || 'unknown')));
}
init();
})();
</script>
</body>
</html>
